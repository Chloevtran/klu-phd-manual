<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sound preview</title>
<style>
  body { margin: 0; padding: 20px 16px; font: 15px/1.4 system-ui, sans-serif; background: #e8f6f7; color: #161a20; }
  h1 { font-size: 18px; margin: 0 0 4px; } p { margin: 0 0 16px; color: #4d5366; font-size: 13px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; max-width: 520px; }
  h2 { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; margin: 0 0 6px; color: #6a1a23; }
  button { display: block; width: 100%; margin-bottom: 8px; padding: 12px; border: 1px solid #d8d0c2; background: #fff; border-radius: 2px; font: 600 13px system-ui; cursor: pointer; text-align: left; }
  .new button { border-color: #6a1a23; }
</style></head>
<body>
<h1>KLU manual · sound preview</h1>
<p>Left: current sounds. Right: proposed sounds. Tap to listen.</p>
<div class="grid">
  <div class="old"><h2>Current</h2></div>
  <div class="new"><h2>Proposed</h2></div>
</div>
<script>
let audio, bus;
const ctx = () => { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); if (audio.state === "suspended") audio.resume(); return audio; };

// Current sounds (as live).
function tone({ frequency, at = 0, duration = 0.12, type = "sine", volume = 0.18, slideTo }) {
  const c = ctx(), start = c.currentTime + at, osc = c.createOscillator(), gain = c.createGain();
  osc.type = type; osc.frequency.setValueAtTime(frequency, start);
  if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, start + duration);
  gain.gain.setValueAtTime(0.0001, start); gain.gain.exponentialRampToValueAtTime(volume, start + 0.01); gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
  osc.connect(gain).connect(c.destination); osc.start(start); osc.stop(start + duration + 0.02);
}
const oldS = {
  "Tap": () => tone({ frequency: 1250, duration: 0.05, type: "triangle", volume: 0.08 }),
  "Page change": () => tone({ frequency: 520, slideTo: 260, duration: 0.18, volume: 0.06 }),
  "Start the journey": () => [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone({ frequency: f, at: i * 0.09, duration: 0.26, type: "triangle", volume: 0.14 })),
  "SOS opened": () => [0, 0.32].forEach((at) => { tone({ frequency: 988, at, duration: 0.14, type: "square", volume: 0.07 }); tone({ frequency: 740, at: at + 0.15, duration: 0.14, type: "square", volume: 0.07 }); }),
  "Location copied": () => { tone({ frequency: 660, duration: 0.1, type: "square", volume: 0.07 }); tone({ frequency: 990, at: 0.09, duration: 0.16, type: "square", volume: 0.07 }); },
  "Error": () => tone({ frequency: 330, slideTo: 220, duration: 0.3, type: "sawtooth", volume: 0.06 }),
};

// Proposed sounds (same code as app.js).
function output(c) {
  if (bus) return bus;
  const t = c.createBiquadFilter(); t.type = "lowpass"; t.frequency.value = 3800;
  const comp = c.createDynamicsCompressor(); comp.threshold.value = -20; comp.ratio.value = 3;
  const echo = c.createDelay(1); echo.delayTime.value = 0.13;
  const fb = c.createGain(); fb.gain.value = 0.22; const wet = c.createGain(); wet.gain.value = 0.16;
  t.connect(comp).connect(c.destination); t.connect(echo).connect(fb).connect(echo); echo.connect(wet).connect(comp);
  return (bus = t);
}
function chime({ frequency, at = 0, decay = 0.9, volume = 0.1 }) {
  const c = ctx(), start = c.currentTime + at;
  [[1, 1], [2, 0.22], [3, 0.07]].forEach(([mult, level]) => {
    const osc = c.createOscillator(), gain = c.createGain(), end = start + decay / mult;
    osc.type = "sine"; osc.frequency.setValueAtTime(frequency * mult, start);
    gain.gain.setValueAtTime(0.0001, start); gain.gain.exponentialRampToValueAtTime(volume * level, start + 0.006); gain.gain.exponentialRampToValueAtTime(0.0001, end);
    osc.connect(gain).connect(output(c)); osc.start(start); osc.stop(end + 0.05);
  });
}
const N = { A3: 220, C5: 523.25, E5: 659.25, G5: 783.99, A5: 880, C6: 1046.5, E6: 1318.51 };
const newS = {
  "Tap": () => chime({ frequency: 2093, decay: 0.05, volume: 0.035 }),
  "Page change": () => chime({ frequency: N.G5, decay: 0.45, volume: 0.035 }),
  "Start the journey": () => [N.C5, N.E5, N.G5, N.C6].forEach((f, i) => chime({ frequency: f, at: i * 0.12, decay: 1.3, volume: 0.075 })),
  "SOS opened": () => { chime({ frequency: N.E5, decay: 1.1, volume: 0.12 }); chime({ frequency: N.C5, at: 0.42, decay: 1.5, volume: 0.12 }); },
  "Location copied": () => { chime({ frequency: N.A5, decay: 0.5, volume: 0.07 }); chime({ frequency: N.E6, at: 0.1, decay: 0.8, volume: 0.06 }); },
  "Error": () => { chime({ frequency: N.C5 / 2, decay: 0.5, volume: 0.09 }); chime({ frequency: N.A3, at: 0.16, decay: 0.7, volume: 0.09 }); },
};

for (const [sel, set] of [[".old", oldS], [".new", newS]])
  for (const [name, fn] of Object.entries(set)) {
    const b = document.createElement("button"); b.textContent = name; b.onclick = fn;
    document.querySelector(sel).appendChild(b);
  }
</script>
</body></html>
