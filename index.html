<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Vietnam 2026 · KLU PhD Field Manual</title>
  <meta name="description" content="Field manual for participants of the KLU PhD Workshop, Ho Chi Minh City, 25–30 October 2026." />
  <meta name="theme-color" content="#cde9ec" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="KLU Manual" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="app" aria-live="polite"></main>

  <div id="sos" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sos-title" hidden>
    <div class="sheet__backdrop" data-close></div>
    <div class="sheet__panel">
      <div class="sheet__grip" aria-hidden="true"></div>
      <div class="sheet__head">
        <div>
          <p class="kicker kicker--red">Emergency &amp; assistance</p>
          <h2 id="sos-title" class="sheet__title">Need help?</h2>
        </div>
        <button class="icon-btn" type="button" data-close aria-label="Close">✕</button>
      </div>
      <div id="sos-body" class="sheet__body"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="content.js"></script>
  <script src="app.js"></script>
</body>
</html>
